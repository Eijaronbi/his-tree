<!doctype html><html><head><meta charset="utf-8"><title>Faces</title>
<style>html,body{margin:0;background:#120c06}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { robustBox } from '../src/world/frame.js';
const FILES = [
 ['frock','../assets/models/characters/player_1865.glb'],
 ['officer','../assets/models/characters/musa.glb'],
 ['elegant','../assets/models/characters/audience/char_adult_f_elegant.glb'],
 ['simple','../assets/models/characters/bakary.glb'],
 ['worker','../assets/models/characters/salim.glb'],
 ['soldier','../assets/models/characters/audience/char_soldier_blue.glb'],
 ['elder-m','../assets/models/characters/audience/char_old_m_top.glb'],
 ['elder-f','../assets/models/characters/audience/char_old_f_bonnet.glb'],
 ['lofi','../assets/models/characters/lofi.glb']
];
const S=256, loader=new GLTFLoader(), out={}, info={};
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.setSize(S,S); renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color('#1a1209');
scene.add(new THREE.HemisphereLight(0xffe9c4,0x2a1a0c,1.15));
const key=new THREE.DirectionalLight(0xffd9a0,2.5); key.position.set(2.2,3.4,3.0); scene.add(key);
const rim=new THREE.DirectionalLight(0x9fc4ff,1.4); rim.position.set(-2.6,1.8,-2.4); scene.add(rim);
const fill=new THREE.DirectionalLight(0xffb066,0.7); fill.position.set(-1.6,0.6,2.4); scene.add(fill);
const cam=new THREE.PerspectiveCamera(28,S/S,0.01,20);
for (const [id,file] of FILES) {
  try {
    const g=await loader.loadAsync(file);
    const root=g.scene; root.updateMatrixWorld(true);
    const box=robustBox(root);
    const h=box.max.y-box.min.y;
    const s=1.72/Math.max(0.2,h);
    root.scale.setScalar(s); root.updateMatrixWorld(true);
    const b2=robustBox(root);
    const c=new THREE.Vector3(); b2.getCenter(c);
    root.position.set(-c.x,-b2.min.y,-c.z);
    root.traverse(o=>{ if(o.isMesh){ o.frustumCulled=false; if(o.material) o.material.envMapIntensity=0.7; } });
    scene.add(root);
    root.updateMatrixWorld(true);
    const b3=robustBox(root);
    const H=b3.max.y-b3.min.y;
    let meshes=0, verts=0; root.traverse(o=>{ if(o.isMesh){meshes++; if(o.geometry?.attributes?.position) verts+=o.geometry.attributes.position.count;} });
    info[id]={H:+H.toFixed(3), scale:+s.toFixed(3), meshes, verts, minY:+b2.min.y.toFixed(3), maxY:+b2.max.y.toFixed(3)};
    // adaptive head framing: measure the top band of the mesh
    const pts=[]; const vv=new THREE.Vector3();
    root.traverse(o=>{ const pos=o.isMesh&&o.geometry&&o.geometry.attributes?o.geometry.attributes.position:null; if(!pos) return;
      const st=Math.max(1,Math.floor(pos.count/6000));
      for(let i=0;i<pos.count;i+=st){ vv.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld); pts.push([vv.x,vv.y,vv.z]); } });
    const cut=b3.max.y-0.17*H;
    const band=pts.filter(a=>a[1]>=cut);
    let hy0=Infinity,hy1=-Infinity,sx=0,sz=0;
    for(const a of band){ if(a[1]<hy0)hy0=a[1]; if(a[1]>hy1)hy1=a[1]; sx+=a[0]; sz+=a[2]; }
    if(!band.length){hy0=cut;hy1=b3.max.y;sx=sz=0;}
    const bandY=band.map(a=>a[1]).sort((a,b)=>a-b);
    const headY=bandY[Math.floor(bandY.length*0.55)]||((hy0+hy1)/2);
    const dist=0.335*H;
    cam.position.set(0.055, headY+0.006, dist);
    cam.lookAt(0, headY-0.004, 0);
    scene.updateMatrixWorld(true);
    renderer.render(scene,cam);
    out[id]=renderer.domElement.toDataURL('image/png');
    scene.remove(root);
  } catch (e) { out[id]='ERR:'+e.message; }
}
window.__faces=out; window.__info=info;
</script></body></html>
